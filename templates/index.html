<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camila's Personal Desktop</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="static/scripts.js"></script>
</head>
<body>
    <div class="container">
        <div class="top">
            <div id="date">Date</div>
            <h1>My Personal Desktop</h1>
            <div id="clock"></div>
        </div>
        <div class="main">
           <div class="widget">
                <h3>Widget 01: Notepad</h3>
                <textarea id="note-area" name="message" rows="20" cols="40"></textarea>
                <button id="saveNoteBtn">Save</button>
           </div>

           <div class="widget">
                <h3>Widget 02: Video</h3>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/iyW4f5pONq0?si=mqgAhOdsHM2YwwJY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
           </div>

           <div class="widget">
                <h3>Widget 03</h3>
           </div>
        </div>
    </div>

<script>
    // 1. Correctly retrieve and check the storage data key
    var savedNote = localStorage.getItem("desktop_note");
    
    if (savedNote !== null) {
        $("#note-area").val(savedNote);
    } else {
        $("#note-area").val("Thank you so much for teaching me!! Ive learned a lot from you!!");
    }

    // 2. Render Calendar Date
    var sp = "/";
    var today = new Date();
    var dd = today.getDate();
    var mm = today.getMonth() + 1; 
    var yyyy = today.getFullYear();
    
    if(dd < 10) { dd = '0' + dd; }
    if(mm < 10) { mm = '0' + mm; }
    
    $("#date").html(mm + sp + dd + sp + yyyy);

    // 3. Match keys exactly when writing back to storage
    $("#saveNoteBtn").click(function(){
        var currentNotes = $("#note-area").val();
        localStorage.setItem("desktop_note", currentNotes);    
        alert("Note saved successfully!");
    });
</script>
</body>
</html>
